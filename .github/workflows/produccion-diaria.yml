name: Reto Visual 70 - Produccion y revision en nube
on:
  schedule:
    - cron: '7 14 * * *'
    - cron: '0 15 * * *'
    - cron: '50 0 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Preparar o enviar revision existente (no publica)
        type: choice
        options: [prepare, notify, remind, repair]
        required: true
        default: prepare
permissions:
  contents: write
  issues: write
concurrency:
  group: rv70-cloud-review
  cancel-in-progress: false
jobs:
  cloud:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Determinar accion
        id: mode
        env:
          INPUT_MODE: ${{ inputs.mode }}
          CRON: ${{ github.event.schedule }}
        run: |
          if [ "$CRON" = '50 0 * * *' ] || [ "$INPUT_MODE" = 'remind' ]; then
            echo 'value=remind' >> "$GITHUB_OUTPUT"
          elif [ "$CRON" = '0 15 * * *' ] || [ "$INPUT_MODE" = 'notify' ]; then
            echo 'value=notify' >> "$GITHUB_OUTPUT"
          elif [ "$INPUT_MODE" = 'repair' ]; then
            echo 'value=repair' >> "$GITHUB_OUTPUT"
          else
            echo 'value=prepare' >> "$GITHUB_OUTPUT"
          fi
      - name: Comprobar cola antes de instalar dependencias
        id: gate
        if: steps.mode.outputs.value == 'prepare'
        run: python daily/cloud.py gate
      - name: Dependencias gratuitas de produccion
        if: (steps.mode.outputs.value == 'prepare' && steps.gate.outputs.allowed == 'true') || steps.mode.outputs.value == 'repair'
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            timeout 180s sudo apt-get update -qq
            timeout 180s sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version
          ffprobe -version
          python -m pip install -r daily/requirements.txt
          python -m unittest discover -s tests -p test_cloud.py
      - name: Preparar y verificar entrega
        if: steps.mode.outputs.value == 'prepare' && steps.gate.outputs.allowed == 'true'
        run: python daily/cloud.py prepare
      - name: Reparacion manual de reserva fallida sin archivos
        if: steps.mode.outputs.value == 'repair'
        run: python daily/cloud.py repair
      - name: Crear aviso de revision
        if: steps.mode.outputs.value == 'notify'
        run: python daily/cloud.py notify
      - name: Recordatorio de publicacion aprobada a las 18 50
        if: steps.mode.outputs.value == 'remind'
        run: python daily/cloud.py remind
      - name: Avisar fallo sin reintentar
        if: failure()
        run: python daily/cloud.py failure
