name: Reto Visual 70 - Produccion y revision en nube
on:
  schedule:
    - cron: '7 14 * * *'
    - cron: '0 15 * * *'
    - cron: '50 0 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Preparar o enviar revision existente (no publica)
        type: choice
        options: [prepare, notify, remind, repair, correct]
        required: true
        default: prepare
      correction_tag:
        description: Reserva cuya correccion solicito el propietario
        type: string
        required: false
      generation_date:
        description: Fecha opcional para preparar (AAAA-MM-DD, desde ayer hasta 7 dias adelante)
        type: string
        required: false
      notify_when_ready:
        description: Enviar aviso al terminar la preparacion manual (no aprueba ni publica)
        type: boolean
        required: false
        default: false
permissions:
  contents: write
  issues: write
concurrency:
  group: rv70-cloud-review
  cancel-in-progress: false
jobs:
  cloud:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      RV70_BUFFER_ENABLED: ${{ vars.RV70_BUFFER_ENABLED }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
      CORRECTION_TAG: ${{ inputs.correction_tag }}
      GENERATION_DATE: ${{ inputs.generation_date }}
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Determinar accion
        id: mode
        env:
          INPUT_MODE: ${{ inputs.mode }}
          CRON: ${{ github.event.schedule }}
        run: |
          if [ "$CRON" = '50 0 * * *' ] || [ "$INPUT_MODE" = 'remind' ]; then
            echo 'value=remind' >> "$GITHUB_OUTPUT"
          elif [ "$CRON" = '0 15 * * *' ] || [ "$INPUT_MODE" = 'notify' ]; then
            echo 'value=notify' >> "$GITHUB_OUTPUT"
          elif [ "$INPUT_MODE" = 'repair' ]; then
            echo 'value=repair' >> "$GITHUB_OUTPUT"
          elif [ "$INPUT_MODE" = 'correct' ]; then
            echo 'value=correct' >> "$GITHUB_OUTPUT"
          else
            echo 'value=prepare' >> "$GITHUB_OUTPUT"
          fi
      - name: Comprobar cola antes de instalar dependencias
        id: gate
        if: steps.mode.outputs.value == 'prepare'
        run: python daily/cloud.py gate
      - name: Dependencias gratuitas de produccion
        if: (steps.mode.outputs.value == 'prepare' && steps.gate.outputs.allowed == 'true') || steps.mode.outputs.value == 'repair' || steps.mode.outputs.value == 'correct'
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            # El update inicial agotaba 180s (exit 124). Intentar primero
            # con indices preinstalados en ubuntu-24.04; actualizar solo como respaldo.
            if ! timeout 120s sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends ffmpeg; then
              timeout 90s sudo apt-get update -qq
              timeout 120s sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends ffmpeg
            fi
          fi
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version
          ffprobe -version
          python -m pip install -r daily/requirements.txt
          python -m unittest discover -s tests -p test_cloud.py
          python -m unittest discover -s tests -p test_catalog.py
          python -m unittest discover -s tests -p test_procedure.py
      - name: Preparar y verificar entrega
        if: steps.mode.outputs.value == 'prepare' && steps.gate.outputs.allowed == 'true'
        run: python daily/cloud.py prepare
      - name: Reparacion manual de reserva fallida sin archivos
        if: steps.mode.outputs.value == 'repair'
        run: python daily/cloud.py repair
      - name: Crear aviso de revision
        if: steps.mode.outputs.value == 'notify' || (steps.mode.outputs.value == 'prepare' && steps.gate.outputs.allowed == 'true' && inputs.notify_when_ready == true)
        run: python daily/cloud.py notify
      - name: Corregir comparar y volver a avisar el mismo dia
        if: steps.mode.outputs.value == 'correct'
        run: python daily/cloud.py correct
      - name: Recordatorio de publicacion aprobada a las 18 50
        if: steps.mode.outputs.value == 'remind'
        run: python daily/cloud.py remind
      - name: Avisar fallo sin reintentar
        if: failure()
        run: python daily/cloud.py failure
