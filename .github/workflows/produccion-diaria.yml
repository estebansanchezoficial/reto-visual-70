name: Reto Visual 70 - Produccion y revision en nube
on:
  schedule:
    - cron: '7 14 * * *'
    - cron: '0 15 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Preparar o enviar revision existente (no publica)
        type: choice
        options: [prepare, notify]
        required: true
        default: prepare
permissions:
  contents: write
  issues: write
concurrency:
  group: rv70-cloud-review
  cancel-in-progress: false
jobs:
  cloud:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Determinar accion
        id: mode
        env:
          INPUT_MODE: ${{ inputs.mode }}
          CRON: ${{ github.event.schedule }}
        run: |
          if [ "$CRON" = '0 15 * * *' ] || [ "$INPUT_MODE" = 'notify' ]; then
            echo 'value=notify' >> "$GITHUB_OUTPUT"
          else
            echo 'value=prepare' >> "$GITHUB_OUTPUT"
          fi
      - name: Dependencias gratuitas de produccion
        if: steps.mode.outputs.value == 'prepare'
        run: |
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
          python -m pip install -r daily/requirements.txt
      - name: Preparar y verificar entrega
        if: steps.mode.outputs.value == 'prepare'
        run: python daily/cloud.py prepare
      - name: Crear aviso de revision
        if: steps.mode.outputs.value == 'notify'
        run: python daily/cloud.py notify
      - name: Avisar fallo sin reintentar
        if: failure()
        run: python daily/cloud.py notify
