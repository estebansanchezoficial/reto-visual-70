name: Reto Visual 70 - Validar dependencias y pruebas
on:
  push:
    paths:
      - '**/*.py'
      - '**/requirements.txt'
      - '.github/workflows/verificar-cambios.yml'
  pull_request:
    paths:
      - '**/*.py'
      - '**/requirements.txt'
      - '.github/workflows/verificar-cambios.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar las mismas dependencias que produccion
        run: python -m pip install -r daily/requirements.txt
      - name: Comprobar dependencias y todas las pruebas
        run: |
          python -m pip check
          python -m unittest discover -s tests
